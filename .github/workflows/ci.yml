name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  deps:
    name: Dependencies (cargo-deny, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image + browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: privatebin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          # The E2E suite posts pastes and comments back to back, so disable the rate limit.
          docker run -d --name pb --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e PRIVATEBIN__TRAFFIC__LIMIT=0 -p 127.0.0.1:8080:8080 \
            --mount type=volume,source=pbdata,target=/data privatebin:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          docker exec pb /privatebin healthcheck
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      # Use the Google Chrome preinstalled on GitHub's Ubuntu runners: downloading
      # Playwright's own Chromium (`playwright install --with-deps`) hangs on the runners.
      - name: Check Chrome
        run: google-chrome --version
      - name: Run Playwright
        working-directory: e2e
        timeout-minutes: 10
        env:
          PB_URL: http://127.0.0.1:8080/
          PB_CHANNEL: chrome
        run: npx playwright test --global-timeout=480000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Container logs
        if: always()
        run: docker logs pb; docker rm -f pb
