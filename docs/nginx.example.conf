# Example Nginx site for PrivateBin running via docker compose on the same host
# (container published on 127.0.0.1:8080). HTTPS is required: browsers only
# expose WebCrypto, which does all encryption, in a secure context.

server {
    listen 80;
    listen [::]:80;
    server_name paste.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name paste.example.com;

    ssl_certificate     /etc/letsencrypt/live/paste.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paste.example.com/privkey.pem;

    # The server sends CSP and the other security headers itself; HSTS is
    # left to the proxy because only it knows the site is HTTPS-only.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Must be larger than main.size_limit (10 MiB of ciphertext by default)
    # plus JSON overhead, or uploads fail with 413 before reaching the app.
    client_max_body_size 16m;
    # Cut off clients that send slowly; the app enforces its own limits too.
    client_header_timeout 15s;
    client_body_timeout 30s;

    # Never log query strings: they contain paste IDs and delete tokens.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
